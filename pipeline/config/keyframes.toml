# Joint-space keyframes (radians) for kinematics.interpolate_keyframes.
# Joint names follow flybody fruitfly.xml; verify against the real model in HUMAN-05.
# Every section is <= 4000 ms; times ascend.

[grooming]  # front legs sweep over the antennae, head tilts
[[grooming.keyframes]]
t_ms = 0
joints = { coxa_T1_left = 0.0, femur_T1_left = 0.0, tibia_T1_left = 0.0, coxa_T1_right = 0.0, femur_T1_right = 0.0, tibia_T1_right = 0.0, head = 0.0 }
