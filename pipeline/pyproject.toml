[project]
name = "flybrain-pipeline"
version = "0.1.0"
description = "Offline asset pipeline for FlyBrain Lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "mujoco==3.16.0",
    "h5py",
    "fast-simplification==0.2.0",
    "jsonschema",
]

[project.optional-dependencies]
fetch = [
    "fafbseg==3.2.2",
    "navis==1.12.0",
]

[project.scripts]
flybrain = "flybrain_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain_pipeline"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flybrain_pipeline --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
